[package]
name = "openclaw-rs"
version = "0.1.0"
edition = "2024"
description = "Single-binary OpenClaw Gateway: OpenRouter agent, SQLite state, Web/CLI/QQ"
license = "MIT"
publish = false

[[bin]]
name = "openclaw-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
croner = "4.0.1"
futures-util = "0.3.34"
libc = "0.2.190"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "time", "sync", "process", "fs", "net"] }
toml = "1.1.8"

[profile.release]
# Small binary and low RSS on Raspberry Pi class hosts.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
