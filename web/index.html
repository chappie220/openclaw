<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenClaw</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e4e4df; --accent: #2f6f4f; --accent-text: #ffffff;
    --user: #e8f0eb; --tool: #f1f1ec; --warn: #fff6e0; --warn-line: #e6c56f; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ececE8; --muted: #9a9a93;
      --line: #33332f; --accent: #6fbf94; --accent-text: #10241a;
      --user: #23332a; --tool: #262623; --warn: #3a311a; --warn-line: #8a6d24; --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  aside { width: 230px; flex: none; border-right: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; }
  aside header { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 16px; }
  aside h1 { font-size: 16px; margin: 0; }
  #lang { min-height: 28px; padding: 0 10px; font-size: 12px; }
  #new { display: flex; gap: 6px; padding: 0 12px 12px; }
  #new input { flex: 1; min-width: 0; }
  #sessions { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
  #sessions li { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  #sessions li:hover { background: var(--tool); }
  #sessions li.active { background: var(--user); font-weight: 600; }
  #sessions .count { color: var(--muted); font-weight: normal; font-size: 12px; }
  #status { padding: 10px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 24px max(16px, calc(50% - 380px)); }
  .msg { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .user { background: var(--user); margin-left: 15%; }
  .assistant { background: var(--panel); border: 1px solid var(--line); }
  .tool { background: var(--tool); font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; padding: 6px 10px; }
  .tool summary { cursor: pointer; color: var(--muted); }
  .tool pre { margin: 6px 0 0; white-space: pre-wrap; max-height: 300px; overflow: auto; }
  .approval { background: var(--warn); border: 1px solid var(--warn-line); }
  .approval code { display: block; margin: 6px 0 10px; white-space: pre-wrap; font-size: 13px; }
  .error { color: var(--error); border: 1px solid var(--error); background: transparent; }
  form#composer { display: flex; gap: 8px; padding: 12px max(16px, calc(50% - 380px)) 20px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 200px; font: inherit; }
  input, textarea { padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  button { padding: 0 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); font: inherit; cursor: pointer; min-height: 36px; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    aside { width: auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .user { margin-left: 8%; }
  }
</style>
</head>
<body>
<aside>
  <header><h1>OpenClaw</h1><button id="lang" class="secondary" type="button"></button></header>
  <form id="new"><input id="newName" data-i18n-placeholder="newName" maxlength="64"><button data-i18n="create"></button></form>
  <ul id="sessions"></ul>
  <div id="status"></div>
</aside>
<main>
  <div id="log"></div>
  <form id="composer">
    <textarea id="input" rows="1" data-i18n-placeholder="input"></textarea>
    <button id="send"></button>
  </form>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);

// Every text the page shows itself; replies come from the server as they are.
const STRINGS = {
  en: {
    newName: "New session name", create: "New", input: "Message — Enter to send, Shift+Enter for a new line",
    send: "Send", stop: "Stop", connecting: "Connecting…", connected: "Connected", reconnecting: "Disconnected, retrying in 3 s",
    token: "Access token needed (OPENCLAW_RS_TOKEN):", allowTool: "Allow {tool}?", allow: "Allow", deny: "Deny",
    allowed: "Allowed {tool}", denied: "Denied {tool}", switchTo: "中文",
  },
  zh: {
    newName: "新会话名称", create: "新建", input: "输入消息，Enter 发送，Shift+Enter 换行",
    send: "发送", stop: "停止", connecting: "连接中…", connected: "已连接", reconnecting: "连接断开，3 秒后重试",
    token: "需要访问令牌（OPENCLAW_RS_TOKEN）：", allowTool: "允许执行 {tool}？", allow: "允许", deny: "拒绝",
    allowed: "已允许 {tool}", denied: "已拒绝 {tool}", switchTo: "EN",
  },
};
const LANG_KEY = "openclaw.lang";
function preferredLang() {
  const saved = localStorage.getItem(LANG_KEY);
  if (saved && STRINGS[saved]) return saved;
  const browser = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
  return browser.some((l) => l.toLowerCase().startsWith("zh")) ? "zh" : "en";
}
let lang = preferredLang();
let statusKey = "connecting";
function t(key, vars = {}) {
  return (STRINGS[lang][key] || STRINGS.en[key]).replace(/\{(\w+)\}/g, (_, name) => vars[name] ?? "");
}
function setStatus(key) { statusKey = key; $("status").textContent = t(key); }
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-placeholder]")) el.placeholder = t(el.dataset.i18nPlaceholder);
  $("lang").textContent = t("switchTo");
  $("status").textContent = t(statusKey);
  updateComposer();
}
$("lang").onclick = () => {
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem(LANG_KEY, lang);
  applyLang();
};
const log = $("log"), input = $("input");
let ws, current = localStorage.getItem("openclaw.session") || "main";
let streaming = null; // assistant bubble receiving deltas for the current session
const busy = new Set();

function token() {
  const fromHash = new URLSearchParams(location.hash.slice(1)).get("token");
  if (fromHash) { localStorage.setItem("openclaw.token", fromHash); history.replaceState(null, "", location.pathname); }
  return localStorage.getItem("openclaw.token") || "";
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token())}`);
  ws.onopen = () => { setStatus("connected"); send({ type: "sessions" }); open(current); };
  ws.onclose = (e) => {
    setStatus("reconnecting");
    if (e.code === 1006 && !ws.everOpened) {
      const entered = prompt(t("token"));
      if (entered !== null) localStorage.setItem("openclaw.token", entered.trim());
    }
    setTimeout(connect, 3000);
  };
  ws.addEventListener("open", () => { ws.everOpened = true; });
  ws.onmessage = (e) => handle(JSON.parse(e.data));
}

function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

function bubble(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function open(name) {
  current = name;
  localStorage.setItem("openclaw.session", name);
  streaming = null;
  log.textContent = "";
  for (const li of $("sessions").children) li.classList.toggle("active", li.dataset.name === name);
  send({ type: "history", session: name });
  updateComposer();
}

// While the session's turn runs, the button stops it instead of sending.
function updateComposer() {
  const running = busy.has(current);
  $("send").textContent = t(running ? "stop" : "send");
  $("send").classList.toggle("secondary", running);
}

function renderSessions(list) {
  if (!list.some((s) => s.name === current)) list.unshift({ name: current, messages: 0 });
  const ul = $("sessions");
  ul.textContent = "";
  for (const s of list) {
    const li = document.createElement("li");
    li.dataset.name = s.name;
    li.className = s.name === current ? "active" : "";
    const label = document.createElement("span"); label.textContent = s.name;
    const count = document.createElement("span"); count.className = "count"; count.textContent = s.messages;
    li.append(label, count);
    li.onclick = () => open(s.name);
    ul.appendChild(li);
  }
}

function handle(m) {
  if (m.type === "sessions") return renderSessions(m.sessions);
  if (m.type === "updated") {
    send({ type: "sessions" });
    if (m.session === current && !busy.has(current)) send({ type: "history", session: current });
    return;
  }
  if (m.session && m.session !== current) {
    if (m.type === "done" || m.type === "error") { busy.delete(m.session); send({ type: "sessions" }); return; }
    if (m.type !== "approval") return;
  }
  const elsewhere = m.session && m.session !== current ? `[${m.session}] ` : "";
  switch (m.type) {
    case "history":
      log.textContent = "";
      for (const item of m.messages) bubble(item.role, item.text);
      break;
    case "text":
      if (!streaming) streaming = bubble("assistant", "");
      streaming.textContent += m.delta;
      log.scrollTop = log.scrollHeight;
      break;
    case "tool_start": {
      streaming = null;
      const d = document.createElement("details");
      d.className = "msg tool";
      d.innerHTML = "<summary></summary><pre></pre>";
      d.querySelector("summary").textContent = `⚙ ${m.name} ${m.arguments}`;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
      break;
    }
    case "tool_end": {
      const all = log.querySelectorAll("details.tool");
      const last = all[all.length - 1];
      if (last) last.querySelector("pre").textContent = m.output;
      break;
    }
    case "approval": {
      streaming = null;
      const card = bubble("approval", "");
      const title = document.createElement("strong"); title.textContent = elsewhere + t("allowTool", { tool: m.tool });
      const code = document.createElement("code"); code.textContent = m.summary;
      const yes = document.createElement("button"); yes.textContent = t("allow");
      const no = document.createElement("button"); no.textContent = t("deny"); no.className = "secondary"; no.style.marginLeft = "8px";
      const answer = (allow) => { send({ type: "approve", id: m.id, allow }); card.textContent = t(allow ? "allowed" : "denied", { tool: m.tool }); };
      yes.onclick = () => answer(true); no.onclick = () => answer(false);
      card.append(title, code, yes, no);
      break;
    }
    case "done":
      // A stopped turn ends with a note that differs from what streamed.
      if (m.text && (!streaming || streaming.textContent !== m.text)) bubble("assistant", m.text);
      streaming = null; busy.delete(m.session); updateComposer(); send({ type: "sessions" });
      break;
    case "error":
      streaming = null; bubble("error", m.message);
      if (m.session) { busy.delete(m.session); updateComposer(); }
      break;
  }
}

$("composer").onsubmit = (e) => {
  e.preventDefault();
  if (busy.has(current)) { send({ type: "stop", session: current }); return; }
  const text = input.value.trim();
  if (!text) return;
  bubble("user", text);
  streaming = null;
  busy.add(current); updateComposer();
  send({ type: "send", session: current, text });
  input.value = ""; input.style.height = "";
};
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = ""; input.style.height = input.scrollHeight + "px"; });
$("new").onsubmit = (e) => {
  e.preventDefault();
  const name = $("newName").value.trim();
  if (name) { $("newName").value = ""; open(name); send({ type: "sessions" }); }
};
applyLang();
token();
connect();
</script>
</body>
</html>
